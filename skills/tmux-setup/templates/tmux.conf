# =============================================================================
# Tmux Configuration (Remote Work Optimized)
# =============================================================================

# --- Base settings ---
set -g default-terminal "screen-256color"    # 256-color support
set -ga terminal-overrides ",xterm-256color:Tc"  # True Color
set -g history-limit 50000                   # scrollback history
set -g mouse on                              # mouse support (scroll / select / resize panes)
set -g base-index 1                          # windows numbered from 1
setw -g pane-base-index 1                    # panes numbered from 1
set -g renumber-windows on                   # renumber windows after one is closed
set -sg escape-time 0                        # drop ESC delay (vim-friendly)

# --- Prefix key ---
# Keep tmux's default Ctrl-b (avoids clashing with terminals like VS Code)

# --- Split bindings ---
bind | split-window -h -c "#{pane_current_path}"   # | split horizontally
bind - split-window -v -c "#{pane_current_path}"   # - split vertically
bind c new-window -c "#{pane_current_path}"         # new window inherits cwd

# --- Pane navigation (vim style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Quick actions ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # prefix + r reloads config

# --- Copy mode (vi style) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"   # macOS clipboard

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #h #[bg=#1e1e2e,fg=#89b4fa] #S "
set -g status-right "#[fg=#6c7086] %H:%M %Y-%m-%d "
set -g status-right-length 40

# Window labels
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "

# Don't let the shell auto-rename windows (keep stable names)
setw -g automatic-rename off

# --- Session behavior ---
# Default tmux behavior: closing the current session detaches the client back to
# the shell. (Set to `off` if you'd rather switch to the next session instead —
# but with multiple clients attached to different sessions, `off` can land two
# windows on the same session.)
set -g detach-on-destroy on

# --- Pane borders ---
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
