# devices.conf — your machine inventory for tmux-setup.
#
# Copy this file to `devices.conf` (same directory) and list your own machines.
# `devices.conf` is gitignored; this example is the template.
#
#   cp devices.example.conf devices.conf
#   # then edit devices.conf with your hosts
#
# One machine per line, five pipe-separated fields:
#
#   host_id | platform | ssh_user | ssh_host | display_name
#
#   host_id       short unique id you pass on the command line (e.g. `sync.sh web1`)
#   platform      one of: macos | ubuntu | openwrt | local
#                   - local  = this machine, operated directly (no SSH)
#                   - macos  = Homebrew-based install
#                   - ubuntu = apt-based install (needs passwordless sudo, see SKILL.md)
#                   - openwrt = minimal opkg install (tmux only, lightweight t())
#   ssh_user      SSH login user (ignored for `local`)
#   ssh_host      hostname or IP reachable over SSH (use `localhost` for `local`)
#   display_name  human label shown in the interactive menu
#
# Lines starting with # and blank lines are ignored.
#
# ── examples (replace with your own) ──────────────────────────────────────
this-mac|local|me|localhost|This machine
workstation|macos|me|workstation.example.com|Desk workstation
build-server|ubuntu|deploy|build.example.com|CI build server
home-router|openwrt|root|192.0.2.1|Home router
